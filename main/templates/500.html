{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong - Jason Peck</title>
    <meta name="robots" content="noindex">
    <link rel="shortcut icon" href="{% static 'main/img/favicon/favicon.ico' %}">
    <!-- Deliberately self-contained: a 500 page renders with an empty context,
         so it must not depend on the base template or any context processor. -->
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background-color: #2A1B3D;
            color-scheme: dark;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        h1 { font-size: 2rem; font-weight: 400; margin: 0 0 12px; }
        p { max-width: 38rem; line-height: 1.6; margin: 0 0 24px; }
        a {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 2px;
            background-color: #C9306F;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover, a:focus { background-color: #b32a62; }
        a:focus-visible { outline: 3px solid #E86AA5; outline-offset: 2px; }
    </style>
</head>
<body>
    <h1>Something went wrong</h1>
    <p>An error occurred on my end, not yours. Try again in a moment, or email me directly at <a href="mailto:pecjas@gmail.com" style="background:none;color:#E86AA5;padding:0;">pecjas@gmail.com</a> if it keeps happening.</p>
    <a href="/">Back to home</a>
</body>
</html>
