{% extends "main/project.html" %}

{% block project_content %}
{% if project.demoVideo %}
<video controls loop muted playsinline>
    <source src="{{ project.demoVideo.url }}" type="video/mp4">
    Your browser does not support the video tag.
</video>
{% endif %}

{% if images %}
<div class="gallery">
    {% for image in images %}
    <figure class="card">
        <img class="zoomable" src="{{ image.image.url }}" alt="{{ image.title }}"
             width="{{ image.width }}" height="{{ image.height }}" loading="lazy" decoding="async">
    </figure>
    {% endfor %}
</div>
{% endif %}
{% endblock %}
