{% comment %}Rendered as inert nodes; app.js promotes them into live toasts.
Without JS the text is still present and announced.{% endcomment %}
{% if messages %}
<div class="sr-only" role="status" aria-live="polite">
    {% for message in messages %}
    <p data-toast="{{ message.tags|default:'info' }}" data-toast-life="{% if message.tags == 'error' or message.tags == 'warning' %}10000{% else %}5000{% endif %}">{{ message }}</p>
    {% endfor %}
</div>
{% endif %}
